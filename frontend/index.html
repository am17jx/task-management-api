<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="color: red; padding: 20px; font-size: 24px; background: white; z-index: 9999; position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><h1>Error:</h1><pre>' + message + '\n' + source + ':' + lineno + '</pre></div>';
      };
      window.onunhandledrejection = function(event) {
         document.body.innerHTML = '<div style="color: red; padding: 20px; font-size: 24px; background: white; z-index: 9999; position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><h1>Unhandled Rejection:</h1><pre>' + event.reason + '</pre></div>';
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
